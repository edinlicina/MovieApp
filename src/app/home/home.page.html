<ion-header>
  <ion-toolbar>
    <ion-title>Popular Movies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <p>Movies loaded: {{ movies.length }}</p>

  <ion-list>
    <ion-item *ngFor="let movie of movies">
      <ion-label>
        <h2>{{ movie.title }}</h2>
        <p>TMDB Rating: {{ movie.rating }} / 10</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
